<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Vi sinh</title>
<script>
window.MathJax={
 tex:{inlineMath:[['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},
 options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"
 onload="window.renderPendingMath&&window.renderPendingMath()"
 onerror="window.mathJaxLoadFailed&&window.mathJaxLoadFailed()"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:clamp(12px,3vw,24px);background:#f5f7fb;color:#172033}
h1{font-size:clamp(1.5rem,4vw,2rem);line-height:1.25;margin:0 0 18px;overflow-wrap:anywhere}
.card{background:#fff;padding:clamp(14px,2.5vw,20px);border-radius:12px;margin:12px 0;box-shadow:0 2px 8px rgba(15,23,42,.08);overflow-wrap:anywhere}
.settings-card{display:grid;gap:16px}
.settings-card h3{margin:0}
.mode-options,.action-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-options label{min-height:44px;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #dbe2ea;border-radius:8px}
.source-controls,.filter-controls{display:grid;gap:12px;align-items:end}
.source-controls{grid-template-columns:repeat(2,minmax(0,1fr))}
.filter-controls{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.92rem;font-weight:600;color:#374151}
select,input[type=number]{width:100%;min-width:0;min-height:44px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:inherit;font:inherit}
button{min-height:44px;padding:10px 15px;border:none;border-radius:8px;background:#2563eb;color:white;font:inherit;font-weight:600;cursor:pointer;transition:background .15s ease,transform .15s ease}
button:hover{background:#1d4ed8}
button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.secondary{background:#64748b}
.secondary:hover{background:#475569}
.correct{background:#dcfce7}.wrong{background:#fee2e2}
.hidden{display:none!important}
.action-buttons{grid-column:1/-1}
#sourceMessage{grid-column:1/-1;min-height:1.25em;color:#475569;overflow-wrap:anywhere}
#submitArea{text-align:right;margin:16px 0}
.answer-option,.answer-option label,.answer-content{min-width:0}
.answer-option label{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:44px;padding:10px;border-radius:8px;cursor:pointer;line-height:1.45}
.answer-option label:hover{background:#f8fafc}
.answer-option input{flex:0 0 auto;width:20px;height:20px;margin:1px 0 0;accent-color:#2563eb}
.answer-content{display:block;flex:1 1 0;max-width:100%;overflow-wrap:anywhere}
.answer-content mjx-container{max-width:100%;vertical-align:middle}
mjx-container[display="true"]{display:block;text-align:left}
.progress{font-weight:bold;color:#1d4ed8}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
@media(max-width:700px){
 .filter-controls{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
 body{padding:12px}
 .source-controls,.filter-controls{grid-template-columns:1fr}
 .action-buttons{display:grid;grid-template-columns:1fr}
 .action-buttons button{width:100%}
 .mode-options{display:grid;grid-template-columns:1fr 1fr}
 .mode-options label{justify-content:center;padding:8px 6px}
 #submitArea button{width:100%}
}
</style>
</head>
<body>
<h1 id='pageTitle'>🦠 Ôn tập</h1>
<div class='card settings-card'>
<h3>Chế độ</h3>
<div class='mode-options'>
<label><input type='radio' name='mode' value='study' checked> Ôn tập</label>
<label><input type='radio' name='mode' value='exam'> Thi thử</label>
</div>
<div class='source-controls'>
<div class='field'><label for='source'>Nguồn câu hỏi</label>
<select id='source' onchange='updateSubjects()'>
<option value='server'>Máy chủ</option>
<option value='local'>Thiết bị này</option>
</select></div>
<div class='field'><label for='subject'>Môn học</label>
<select id='subject' onchange='loadSubject()'></select></div>
<div class='action-buttons'>
<button type='button' class='secondary' onclick='document.getElementById("importFile").click()'>Nhập JSON</button>
<input id='importFile' type='file' accept='.json,application/json' class='hidden' onchange='importQuestions(event)'>
<button type='button' class='secondary' onclick='exportQuestions()'>Xuất JSON</button>
<button id='practiceWrongButton' type='button' class='secondary hidden' onclick='practiceWrongQuestions()'>Luyện tập câu sai</button>
</div>
<div id='sourceMessage' role='status'></div>
</div>
<div class='filter-controls'>
<div class='field'><label for='category'>Chủ đề</label>
<select id='category'>
<option value='ALL'>Tất cả</option>
</select></div>
<div class='field'><label for='difficulty'>Độ khó</label>
<select id='difficulty'>
<option value='ALL'>Tất cả</option>
</select></div>
<div class='field'><label for='count'>Số câu</label>
<input id='count' type='number' value='50' min='1' max='200'></div>
<button onclick='startQuiz()'>Bắt đầu</button>
</div>
</div>
<div id='quiz'></div>
<div id='submitArea' class='hidden'><button onclick='submitQuiz()'>Nộp bài</button></div>
<div id='result'></div>
<script>
const fallbackServerSubjects=[
 {name:'Vi sinh',file:'questions.json'},
 {name:'Vi sinh - 200 câu',file:'questions_200_vi_sinh.json'},
 {name:'Vi sinh - 100 câu',file:'questions 100.json'},
 {name:'Vi sinh - 25 câu 1',file:'25cau1.json'},
 {name:'Vi sinh - 25 câu 2',file:'25cau2.json'},
 {name:'Vi sinh - 25 câu 3',file:'25cau3.json'},
 {name:'Vi sinh - 25 câu 4',file:'25cau4.json'},
 {name:'Xác suất thống kê',file:'XSTK.json'}
];
let serverSubjects=[...fallbackServerSubjects],serverDiscoveryError='';
let allQuestions=[],questions=[];
let isWrongQuestionsPractice=false;
const pendingMathElements=new Set();
let mathTypesetQueue=Promise.resolve();
const localKey='questionSets';
const wrongQuestionsKey='wrongQuestions';
const wrongQuestionsSubject='__wrong_questions__';
function githubPagesRepository(){
 const suffix='.github.io';
 const hostname=location.hostname.toLowerCase();
 if(!hostname.endsWith(suffix))return null;
 const owner=hostname.slice(0,-suffix.length);
 const pathParts=location.pathname.split('/').filter(Boolean);
 return {owner,repo:pathParts[0]||`${owner}.github.io`};
}
async function githubDirectory(owner,repo,directory=''){
 const path=directory?`/${directory}`:'';
 const response=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents${path}`,{cache:'no-store'});
 if(!response.ok)throw new Error(`GitHub returned ${response.status}`);
 return response.json();
}
async function discoverGithubQuestions(){
 const repository=githubPagesRepository();
 if(!repository)return;
 try{
  let entries=await githubDirectory(repository.owner,repository.repo);
  const docs=entries.find(item=>item.name==='docs'&&item.type==='dir');
  if(docs){
   const docsEntries=await githubDirectory(repository.owner,repository.repo,'docs');
   if(docsEntries.some(item=>item.name==='index.html'))entries=docsEntries;
  }
  serverSubjects=entries
   .filter(item=>item.type==='file'&&item.name.toLowerCase().endsWith('.json'))
   .map(item=>({name:item.name.replace(/\.json$/i,'').replace(/[_-]+/g,' '),file:item.name}))
   .sort((a,b)=>{
    if(a.file.toLowerCase()==='questions.json')return -1;
    if(b.file.toLowerCase()==='questions.json')return 1;
    return a.name.localeCompare(b.name,undefined,{numeric:true});
   });
  if(!serverSubjects.length)serverDiscoveryError='Không tìm thấy tệp câu hỏi JSON trong kho GitHub.';
 }catch(error){
  serverSubjects=[];
  serverDiscoveryError=`Không thể tải danh sách câu hỏi từ GitHub: ${error.message}`;
 }
}
async function initializeSubjects(){
 await discoverGithubQuestions();
 updateSubjects();
}
function getLocalSets(){
 try{return JSON.parse(localStorage.getItem(localKey)||'{}');}
 catch{return {};}
}
function getWrongQuestions(){
 const questions=JSON.parse(localStorage.getItem(wrongQuestionsKey)||'[]');
 if(!Array.isArray(questions)||!questions.every(isQuestion))
  throw new Error('Danh sách câu trả lời sai trên thiết bị không đúng định dạng.');
 return questions;
}
function questionKey(question){
 return JSON.stringify([question.category||'',question.question,question.options,question.answer]);
}
function reportMathError(error){
 console.error('MathJax rendering failed:',error);
 document.getElementById('sourceMessage').textContent='Không thể hiển thị một số công thức toán học.';
}
function renderMath(element){
 if(window.MathJax&&typeof window.MathJax.typesetPromise==='function'){
  mathTypesetQueue=mathTypesetQueue
   .then(()=>element.isConnected?window.MathJax.typesetPromise([element]):undefined)
   .catch(reportMathError);
 }else pendingMathElements.add(element);
}
window.renderPendingMath=function(){
 if(!window.MathJax||typeof window.MathJax.typesetPromise!=='function')return;
 const elements=[...pendingMathElements].filter(element=>
  element.isConnected&&!([...pendingMathElements].some(other=>other!==element&&other.contains(element)))
 );
 pendingMathElements.clear();
 elements.forEach(renderMath);
};
window.mathJaxLoadFailed=function(){
 document.getElementById('sourceMessage').textContent='Không thể tải MathJax. Công thức sẽ hiển thị dưới dạng văn bản.';
};
function saveWrongQuestions(questions){
 const stored=getWrongQuestions();
 const known=new Set(stored.map(questionKey));
 let added=0;
 questions.forEach(question=>{
  const key=questionKey(question);
  if(!known.has(key)){
   known.add(key);
   stored.push(question);
   added++;
  }
 });
 if(added){
  localStorage.setItem(wrongQuestionsKey,JSON.stringify(stored));
  updateWrongPracticeButton();
  document.getElementById('sourceMessage').textContent=`Đã lưu ${added} câu trả lời sai để luyện tập lại.`;
 }
 return added;
}
function removeWrongQuestions(questions){
 if(!questions.length)return 0;
 const stored=getWrongQuestions();
 const keys=new Set(questions.map(questionKey));
 const remaining=stored.filter(question=>!keys.has(questionKey(question)));
 const removed=stored.length-remaining.length;
 if(removed){
  localStorage.setItem(wrongQuestionsKey,JSON.stringify(remaining));
  updateWrongPracticeButton();
  if(!remaining.length){
   const subject=document.getElementById('subject');
   const option=[...subject.options].find(item=>item.value===wrongQuestionsSubject);
   if(option)option.remove();
  }
  document.getElementById('sourceMessage').textContent=`Đã xóa ${removed} câu đã trả lời đúng khỏi danh sách câu sai.`;
 }
 return removed;
}
function updateWrongPracticeButton(){
 const count=getWrongQuestions().length;
 const button=document.getElementById('practiceWrongButton');
 button.textContent=`Luyện tập câu sai (${count})`;
 button.classList.toggle('hidden',count===0);
}
function practiceWrongQuestions(){
 try{
  if(!getWrongQuestions().length){
   document.getElementById('sourceMessage').textContent='Chưa có câu trả lời sai để luyện tập.';
   updateWrongPracticeButton();
   return;
  }
  document.getElementById('source').value='local';
  updateSubjects(wrongQuestionsSubject);
 }catch(error){
  document.getElementById('sourceMessage').textContent=error.message||'Không thể tải câu trả lời sai.';
 }
}
function updateSubjects(selected){
 const source=document.getElementById('source').value;
 const subject=document.getElementById('subject');
 const entries=source==='server'
  ?serverSubjects.map(item=>({id:item.file,name:item.name}))
  :Object.keys(getLocalSets()).map(name=>({id:name,name}));
 if(source==='local'&&getWrongQuestions().length)
  entries.push({id:wrongQuestionsSubject,name:'Câu trả lời sai'});
 subject.replaceChildren();
 if(!entries.length){
  const option=document.createElement('option');
  option.value='';option.textContent=source==='local'?'Chưa có câu hỏi trên thiết bị':'Không tìm thấy tệp câu hỏi';
  subject.appendChild(option);
 }
 entries.forEach(item=>{
  const option=document.createElement('option');
  option.value=item.id; option.textContent=item.name; subject.appendChild(option);
 });
 if(selected&&entries.some(item=>item.id===selected)) subject.value=selected;
 loadSubject();
}
async function loadSubject(){
 const source=document.getElementById('source').value;
 const id=document.getElementById('subject').value;
 const message=document.getElementById('sourceMessage');
 if(!id){allQuestions=[];message.textContent=source==='local'?'Chưa có bộ câu hỏi trên thiết bị. Hãy nhập tệp JSON.':serverDiscoveryError;updateCategories();updatePageTitle();return;}
 try{
  if(source==='server'){
   const response=await fetch(encodeURIComponent(id),{cache:'no-store'});
   if(!response.ok) throw new Error(`Không thể tải tệp câu hỏi (${response.status}).`);
   allQuestions=await response.json();
  }else allQuestions=id===wrongQuestionsSubject?getWrongQuestions():getLocalSets()[id]||[];
  if(!Array.isArray(allQuestions)||!allQuestions.every(isQuestion)){
   allQuestions=[];throw new Error('Tệp câu hỏi không đúng định dạng.');
  }
  message.textContent=`Đã tải ${allQuestions.length} câu hỏi.`;
  updateCategories();
  updatePageTitle();
 }catch(error){allQuestions=[];updateCategories();updatePageTitle();message.textContent=error.message||'Không thể tải câu hỏi.';}
}
function isQuestion(q){
 return q&&typeof q.question==='string'&&Array.isArray(q.options)&&
  q.options.every(o=>typeof o==='string')&&Number.isInteger(q.answer)&&
  q.answer>=0&&q.answer<q.options.length&&
  (q.explanation===undefined||typeof q.explanation==='string');
}
function escapeHtml(value){
 return String(value).split(/(<br\s*\/?>)/gi).map(part=>
  /^<br\s*\/?>$/i.test(part)
   ?'<br>'
   :part.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))
 ).join('');
}
function updateCategories(){
 const sel=document.getElementById('category');
 const selectedCategory=sel.value;
 sel.replaceChildren(new Option('Tất cả','ALL'));
 const categories=[...new Set(allQuestions.map(x=>x.category).filter(Boolean))];
 categories.forEach(category=>sel.add(new Option(category,category)));
 if(categories.includes(selectedCategory))sel.value=selectedCategory;
 const difficulty=document.getElementById('difficulty');
 const selectedDifficulty=difficulty.value;
 const difficulties=[...new Set(allQuestions.map(x=>x.difficulty).filter(Boolean))];
 const labels={easy:'Dễ',medium:'Trung bình',hard:'Khó'};
 difficulty.replaceChildren(new Option('Tất cả','ALL'));
 difficulties.forEach(value=>difficulty.add(new Option(labels[value]||value,value)));
 if(difficulties.includes(selectedDifficulty))difficulty.value=selectedDifficulty;
}
function updatePageTitle(){
 const translations={
  Bacteriology:'Vi khuẩn học',
  Chemistry:'Hóa học',
  Ethic:'Đạo đức',
  Ethics:'Đạo đức',
  Immunology:'Miễn dịch học',
  Mycology:'Nấm học',
  Parasitology:'Ký sinh trùng học',
  Probability:'Xác suất',
  Virology:'Virus học'
 };
 const icons={
  Bacteriology:'🦠',
  Chemistry:'🧪',
  Ethic:'⚖️',
  Ethics:'⚖️',
  Immunology:'🛡️',
  Mycology:'🍄',
  Parasitology:'🪱',
  Probability:'🎲',
  Virology:'🧬'
 };
 const categories=[...new Set(allQuestions.map(q=>q.category).filter(Boolean))];
 const selectedSubject=document.getElementById('subject').selectedOptions[0]?.textContent||'';
 const subjectNames={'XSTK':'Xác suất thống kê'};
 const title=categories.length
  ?categories.map(category=>translations[category]||category).join(', ')
  :subjectNames[selectedSubject]||selectedSubject;
 const localizedIcons={'Đạo đức':'⚖️','Xác suất':'🎲','Xác suất thống kê':'🎲'};
 const firstCategory=categories[0];
 const icon=firstCategory
  ?icons[firstCategory]||localizedIcons[firstCategory]||'📚'
  :selectedSubject==='XSTK'?'🎲':localizedIcons[title]||'🦠';
 document.getElementById('pageTitle').textContent=`${icon} Ôn tập${title?' '+title:''}`;
}
async function importQuestions(event){
 const file=event.target.files[0]; if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data)||!data.length||!data.every(isQuestion))
   throw new Error('JSON phải là danh sách câu hỏi có question, options và answer hợp lệ.');
  const name=file.name.replace(/\.json$/i,'').trim()||'Câu hỏi đã nhập';
  const sets=getLocalSets();sets[name]=data;
  localStorage.setItem(localKey,JSON.stringify(sets));
  document.getElementById('source').value='local';
  updateSubjects(name);
  document.getElementById('sourceMessage').textContent=`Đã nhập ${data.length} câu hỏi vào "${name}" trên thiết bị này.`;
 }catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể nhập tệp JSON.';}
 finally{event.target.value='';}
}
function exportQuestions(){
 if(!allQuestions.length){document.getElementById('sourceMessage').textContent='Không có câu hỏi để xuất.';return;}
 const blob=new Blob([JSON.stringify(allQuestions,null,2)],{type:'application/json'});
 const link=document.createElement('a');
 link.href=URL.createObjectURL(blob);
 link.download=(document.getElementById('subject').selectedOptions[0]?.textContent||'questions').replace(/[<>:"/\\|?*]/g,'_')+'.json';
 link.click();URL.revokeObjectURL(link.href);
}
updateWrongPracticeButton();
initializeSubjects();
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function startQuiz(){
 const cat=document.getElementById('category').value;
 const difficulty=document.getElementById('difficulty').value;
 const count=parseInt(document.getElementById('count').value)||50;
 let pool=allQuestions.filter(x=>
  (cat==='ALL'||x.category===cat)&&
  (difficulty==='ALL'||x.difficulty===difficulty)
 );
 questions=shuffle(pool).slice(0,Math.min(count,pool.length));
 const mode=document.querySelector('input[name=mode]:checked').value;
 isWrongQuestionsPractice=document.getElementById('source').value==='local'&&
  document.getElementById('subject').value===wrongQuestionsSubject;
 const root=document.getElementById('quiz');
 const result=document.getElementById('result');
 window.MathJax?.typesetClear?.([root,result]);
 root.innerHTML='';
 result.innerHTML='';
 questions.forEach((q,i)=>{
 let html=`<div class='card' id='card${i}'><div class='progress'>Câu ${i+1}</div><p><b>${escapeHtml(q.question)}</b></p>`;
 q.options.forEach((o,idx)=>{
 html+=`<div class='answer-option'><label><input type='radio' name='q${i}' value='${idx}' onchange='answerQuestion(${i},${idx})'><span class='answer-content'>${escapeHtml(o)}</span></label></div>`;
 });
 html+=`<div id='feedback${i}'></div></div>`;
 root.innerHTML+=html;
 });
 renderMath(root);
 window.currentMode=mode;
 document.getElementById('submitArea').classList.toggle('hidden',mode!=='exam');
}
function answerQuestion(i,val){
 if(currentMode!=='study') return;
 const q=questions[i];
 const fb=document.getElementById('feedback'+i);
 const card=document.getElementById('card'+i);
 window.MathJax?.typesetClear?.([fb]);
 if(val===q.answer){
 card.classList.add('correct');
 fb.innerHTML=`✅ Đúng<br><small>${escapeHtml(q.explanation||'')}</small>`;
 renderMath(fb);
 if(isWrongQuestionsPractice){
  try{removeWrongQuestions([q]);}
  catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể cập nhật danh sách câu sai.';}
 }
 }else{
 card.classList.add('wrong');
 fb.innerHTML=`❌ Sai<br>Đáp án đúng: <b>${escapeHtml(q.options[q.answer])}</b><br><small>${escapeHtml(q.explanation||'')}</small>`;
 renderMath(fb);
 try{saveWrongQuestions([q]);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể lưu câu trả lời sai.';}
 }
 }
function submitQuiz(){
 let score=0,review='',wrongQuestions=[],correctWrongQuestions=[];
 questions.forEach((q,i)=>{
 const checked=document.querySelector(`input[name=q${i}]:checked`);
 const user=checked?Number(checked.value):-1;
 const correct=user===q.answer;
 if(correct){
  score++;
  if(isWrongQuestionsPractice)correctWrongQuestions.push(q);
 }else wrongQuestions.push(q);
 review+=`<div class='card ${correct?'correct':'wrong'}'>Câu ${i+1}: ${correct?'✅':'❌'}<br>Đáp án đúng: <b>${escapeHtml(q.options[q.answer])}</b><br>${escapeHtml(q.explanation||'')}</div>`;
 });
 try{saveWrongQuestions(wrongQuestions);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể lưu câu trả lời sai.';}
 try{removeWrongQuestions(correctWrongQuestions);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể cập nhật danh sách câu sai.';}
 const result=document.getElementById('result');
 window.MathJax?.typesetClear?.([result]);
 result.innerHTML=`<div class='card'><h2>Điểm: ${score}/${questions.length}</h2><p>${Math.round(score*100/questions.length)}%</p></div>`+review;
 renderMath(result);
 window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
