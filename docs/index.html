 tex:{inlineMath:[['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:clamp(12px,3vw,24px);background:#f5f7fb;color:#172033}

 body.exam-mode{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
 #submitArea{position:fixed;z-index:10;right:0;bottom:0;left:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #dbe2ea;box-shadow:0 -4px 16px rgba(15,23,42,.08);backdrop-filter:blur(8px)}
 #submitArea button{width:100%;max-width:1100px}
}

<body>
<header class='page-header'>
<h1 id='pageTitle'>🦠 Ôn tập</h1>
<details class='tools-menu' id='toolsMenu'>
<summary aria-label='Mở công cụ quản lý dữ liệu' title='Công cụ quản lý dữ liệu'>⚙️</summary>
<div class='tools-panel'>
<h2>Quản lý dữ liệu</h2>
<button type='button' class='secondary' onclick='openImportPicker()'>Nhập JSON</button>
<button type='button' class='secondary' onclick='exportQuestions()'>Xuất JSON</button>
<button id='openQuestionBuilderButton' type='button' class='secondary' onclick='toggleQuestionBuilder()'>Thêm câu hỏi</button>
<section id='questionBuilder' class='builder-form hidden'>
<h2>Thêm câu hỏi</h2>
<p class='builder-status'>Chọn bộ đề hiện có hoặc tạo bộ đề mới. Bộ đề máy chủ sẽ được sao chép vào thiết bị này trước khi lưu câu hỏi; tệp máy chủ không bị thay đổi. Dùng <code>$$...$$</code> cho công thức toán.</p>
<div class='field'><label for='builderTarget'>Lưu câu hỏi vào</label>
<select id='builderTarget' onchange='updateBuilderTarget()'>
<option value='local'>Bộ đề trên thiết bị</option>
<option value='server'>Sao chép bộ đề máy chủ vào thiết bị</option>
<option value='new'>Tạo bộ đề mới</option>
</select></div>
<div id='builderLocalTarget' class='field'><label for='builderLocalSubject'>Bộ đề trên thiết bị</label>
<select id='builderLocalSubject'></select></div>
<div id='builderServerTarget' class='field hidden'><label for='builderServerSubject'>Bộ đề máy chủ để sao chép</label>
<select id='builderServerSubject'></select></div>
<div id='builderNewTarget' class='field hidden'><label for='builderNewSubject'>Tên bộ đề mới</label>
<input id='builderNewSubject' type='text' maxlength='80' placeholder='Ví dụ: Xác suất thống kê'></div>
<div class='field'><label for='builderCategory'>Chủ đề (không bắt buộc)</label>
<input id='builderCategory' type='text' maxlength='80' placeholder='Ví dụ: Probability'></div>
<div class='field'><label for='builderTopic'>Phần / chủ điểm (không bắt buộc)</label>
<input id='builderTopic' type='text' maxlength='100' placeholder='Ví dụ: To hop'></div>
<div class='field'><label for='builderDifficulty'>Độ khó (không bắt buộc)</label>
<select id='builderDifficulty'>
<option value=''>Không chọn</option><option value='easy'>Dễ</option><option value='medium'>Trung bình</option><option value='hard'>Khó</option>
</select></div>
<div class='field'><label for='builderQuestion'>Câu hỏi</label>
<textarea id='builderQuestion' required placeholder='Nhập câu hỏi; công thức dùng $$...$$'></textarea></div>
<div class='option-fields'>
<div class='field'><label for='builderOptionA'>Lựa chọn A</label><textarea id='builderOptionA' required></textarea></div>
<div class='field'><label for='builderOptionB'>Lựa chọn B</label><textarea id='builderOptionB' required></textarea></div>
<div class='field'><label for='builderOptionC'>Lựa chọn C</label><textarea id='builderOptionC' required></textarea></div>
<div class='field'><label for='builderOptionD'>Lựa chọn D</label><textarea id='builderOptionD' required></textarea></div>
</div>
<div class='field'><span class='field-label'>Đáp án đúng</span>
<div class='answer-choice'>
<label><input type='radio' name='builderAnswer' value='0' checked> A</label>
<label><input type='radio' name='builderAnswer' value='1'> B</label>
<label><input type='radio' name='builderAnswer' value='2'> C</label>
<label><input type='radio' name='builderAnswer' value='3'> D</label>
</div></div>
<div class='field'><label for='builderExplanation'>Giải thích (không bắt buộc)</label>
<textarea id='builderExplanation' placeholder='Có thể nhập công thức bằng $$...$$'></textarea></div>
<div id='builderStatus' class='builder-status' role='status' aria-live='polite'></div>

</section>
</div>
</details>
</header>
<div class='card settings-card'>
<h3>Chế độ</h3>
<div class='mode-options'>
<label><input type='radio' name='mode' value='study' checked onchange='updateModeSettings()'> Ôn tập</label>
<label><input type='radio' name='mode' value='exam' onchange='updateModeSettings()'> Thi thử</label>
</div>
<div class='source-controls'>
<div class='field'><label for='source'>Nguồn câu hỏi</label>
<select id='source' onchange='updateSubjects()'>
<option value='server'>Máy chủ</option>
<option value='local'>Thiết bị này</option>
</select></div>

<select id='subject' onchange='loadSubject()'></select></div>
<div class='action-buttons'>
<button id='practiceWrongButton' type='button' class='secondary hidden' onclick='practiceWrongQuestions()'>Luyện tập câu sai</button>
</div>
<input id='importFile' type='file' accept='.json,application/json' class='hidden' onchange='importQuestions(event)'>
<div id='sourceMessage' role='status'></div>
</div>
<div class='filter-controls'>
<div class='field'><label for='category'>Chủ đề</label>
<select id='category'>
<option value='ALL'>Tất cả</option>
</select></div>
<div class='field'><label for='difficulty'>Độ khó</label>
<select id='difficulty'>
<option value='ALL'>Tất cả</option>
</select></div>
<div class='field'><label for='count'>Số câu</label>
<input id='count' type='number' value='50' min='1' max='200'></div>
<div id='examTimerSetting' class='field hidden'><label for='minutesPerQuestion'>Phút mỗi câu (thi thử)</label>
<input id='minutesPerQuestion' type='number' value='2' min='1' max='60'></div>
<button onclick='startQuiz()'>Bắt đầu</button>
</div>
</div>
<div id='examTimer' class='card hidden' role='timer' aria-live='off'></div>
<div id='quiz'></div>
<div id='submitArea' class='hidden'><button onclick='submitQuiz()'>Nộp bài</button></div>
<div id='result'></div>
<script>
const fallbackServerSubjects=[
 {name:'Vi sinh',file:'questions.json'},
 {name:'Vi sinh - 200 câu',file:'questions_200_vi_sinh.json'},
 {name:'Vi sinh - 100 câu',file:'questions 100.json'},
 {name:'Vi sinh - 25 câu 1',file:'25cau1.json'},
 {name:'Vi sinh - 25 câu 2',file:'25cau2.json'},
 {name:'Vi sinh - 25 câu 3',file:'25cau3.json'},
 {name:'Vi sinh - 25 câu 4',file:'25cau4.json'},
 {name:'Xác suất thống kê',file:'XSTK.json'}
];
let serverSubjects=[...fallbackServerSubjects],serverDiscoveryError='';
let allQuestions=[],questions=[];
let isWrongQuestionsPractice=false;
let examTimerInterval=null,examDeadline=0,examSubmitted=false;
const pendingMathElements=new Set();
let mathTypesetQueue=Promise.resolve();
const localKey='questionSets';
const wrongQuestionsKey='wrongQuestions';
const wrongQuestionsSubject='__wrong_questions__';
function githubPagesRepository(){
 const suffix='.github.io';
 const hostname=location.hostname.toLowerCase();
 if(!hostname.endsWith(suffix))return null;
 const owner=hostname.slice(0,-suffix.length);
 const pathParts=location.pathname.split('/').filter(Boolean);
 return {owner,repo:pathParts[0]||`${owner}.github.io`};
}
async function githubDirectory(owner,repo,directory=''){
 const path=directory?`/${directory}`:'';
 const response=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents${path}`,{cache:'no-store'});
 if(!response.ok)throw new Error(`GitHub returned ${response.status}`);
 return response.json();
}
function setServerQuestionFiles(files){
 serverSubjects=files
  .filter(file=>file.toLowerCase().endsWith('.json'))
  .map(file=>{
   const base=file.replace(/\.json$/i,'');
   return {name:base.toLowerCase()==='xstk'?'Xác suất thống kê':base.replace(/[_-]+/g,' '),file};
  })
  .sort((a,b)=>{
   if(a.file.toLowerCase()==='questions.json')return -1;
   if(b.file.toLowerCase()==='questions.json')return 1;
   return a.name.localeCompare(b.name,undefined,{numeric:true});
  });
}
async function discoverGithubQuestions(){
 const repository=githubPagesRepository();
 if(!repository)return;
 try{
  let entries=await githubDirectory(repository.owner,repository.repo);
  const docs=entries.find(item=>item.name==='docs'&&item.type==='dir');
  if(docs){
   const docsEntries=await githubDirectory(repository.owner,repository.repo,'docs');
   if(docsEntries.some(item=>item.name==='index.html'))entries=docsEntries;
  }
  setServerQuestionFiles(entries.filter(item=>item.type==='file').map(item=>item.name));
  if(!serverSubjects.length)serverDiscoveryError='Không tìm thấy tệp câu hỏi JSON trong kho GitHub.';
 }catch(error){
  serverSubjects=[];
  serverDiscoveryError=`Không thể tải danh sách câu hỏi từ GitHub: ${error.message}`;
 }
}
async function discoverLocalQuestions(){
 try{
  const response=await fetch('/api/question-files',{cache:'no-store'});
  if(!response.ok)throw new Error(`Local server returned ${response.status}`);
  const files=await response.json();
  if(!Array.isArray(files)||!files.every(file=>typeof file==='string'))
   throw new Error('Local server returned an invalid question-file list');
  setServerQuestionFiles(files);
  return true;
 }catch(error){
  serverSubjects=[...fallbackServerSubjects];
  serverDiscoveryError='Để tự động tìm tất cả tệp JSON trên localhost, hãy chạy python serve.py thay cho python -m http.server.';
  return false;
 }
}
async function initializeSubjects(){
 if(githubPagesRepository())await discoverGithubQuestions();
 else if(['localhost','127.0.0.1'].includes(location.hostname))await discoverLocalQuestions();
 await updateSubjects();
 updateBuilderTarget();
 if(serverDiscoveryError&&['localhost','127.0.0.1'].includes(location.hostname))
  document.getElementById('sourceMessage').textContent=serverDiscoveryError;
}
function getLocalSets(){
 try{return JSON.parse(localStorage.getItem(localKey)||'{}');}
 catch{return {};}
}
function getWrongQuestions(){
 const questions=JSON.parse(localStorage.getItem(wrongQuestionsKey)||'[]');
 if(!Array.isArray(questions)||!questions.every(isQuestion))
  throw new Error('Danh sách câu trả lời sai trên thiết bị không đúng định dạng.');
 return questions;
}
function questionKey(question){
 return JSON.stringify([question.category||'',question.question,question.options,question.answer]);
}
function reportMathError(error){
 console.error('MathJax rendering failed:',error);
 document.getElementById('sourceMessage').textContent='Không thể hiển thị một số công thức toán học.';
}
function renderMath(element){
 if(window.MathJax&&typeof window.MathJax.typesetPromise==='function'){
  mathTypesetQueue=mathTypesetQueue
   .then(()=>element.isConnected?window.MathJax.typesetPromise([element]):undefined)
   .catch(reportMathError);
 }else pendingMathElements.add(element);
}
window.renderPendingMath=function(){
 if(!window.MathJax||typeof window.MathJax.typesetPromise!=='function')return;
 const elements=[...pendingMathElements].filter(element=>
  element.isConnected&&!([...pendingMathElements].some(other=>other!==element&&other.contains(element)))
 );
 pendingMathElements.clear();
 elements.forEach(renderMath);
};
window.mathJaxLoadFailed=function(){
 document.getElementById('sourceMessage').textContent='Không thể tải MathJax. Công thức sẽ hiển thị dưới dạng văn bản.';
};
function saveWrongQuestions(questions){
 const stored=getWrongQuestions();
 const known=new Set(stored.map(questionKey));
 let added=0;
 questions.forEach(question=>{
  const key=questionKey(question);
  if(!known.has(key)){
   known.add(key);
   stored.push(question);
   added++;
  }
 });
 if(added){
  localStorage.setItem(wrongQuestionsKey,JSON.stringify(stored));
  updateWrongPracticeButton();
  document.getElementById('sourceMessage').textContent=`Đã lưu ${added} câu trả lời sai để luyện tập lại.`;
 }
 return added;
}
function removeWrongQuestions(questions){
 if(!questions.length)return 0;
 const stored=getWrongQuestions();
 const keys=new Set(questions.map(questionKey));
 const remaining=stored.filter(question=>!keys.has(questionKey(question)));
 const removed=stored.length-remaining.length;
 if(removed){
  localStorage.setItem(wrongQuestionsKey,JSON.stringify(remaining));
  updateWrongPracticeButton();
  if(!remaining.length){
   const subject=document.getElementById('subject');
   const option=[...subject.options].find(item=>item.value===wrongQuestionsSubject);
   if(option)option.remove();
  }
  document.getElementById('sourceMessage').textContent=`Đã xóa ${removed} câu đã trả lời đúng khỏi danh sách câu sai.`;
 }
 return removed;
}
function updateWrongPracticeButton(){
 const count=getWrongQuestions().length;
 const button=document.getElementById('practiceWrongButton');
 button.textContent=`Luyện tập câu sai (${count})`;
 button.classList.toggle('hidden',count===0);
 button.parentElement.classList.toggle('hidden',count===0);
}
function closeToolsMenu(){
 document.getElementById('toolsMenu').open=false;
}
function openImportPicker(){
 closeToolsMenu();
 document.getElementById('importFile').click();
}
function toggleQuestionBuilder(){
 const builder=document.getElementById('questionBuilder');
 const opening=builder.classList.contains('hidden');
 builder.classList.toggle('hidden',!opening);
 document.getElementById('openQuestionBuilderButton').textContent=opening?'Đóng trình nhập câu hỏi':'Thêm câu hỏi';
 if(opening)updateBuilderTarget();
}
function setBuilderStatus(message,type=''){
 const status=document.getElementById('builderStatus');
 status.textContent=message;
 status.classList.remove('error','success');
 if(type)status.classList.add(type);
}
function updateBuilderTarget(){
 const target=document.getElementById('builderTarget').value;
 document.getElementById('builderLocalTarget').classList.toggle('hidden',target!=='local');
 document.getElementById('builderServerTarget').classList.toggle('hidden',target!=='server');
 document.getElementById('builderNewTarget').classList.toggle('hidden',target!=='new');
 const localSelect=document.getElementById('builderLocalSubject');
 const selectedLocal=localSelect.value;
 const localNames=Object.keys(getLocalSets());
 localSelect.replaceChildren();
 localNames.forEach(name=>localSelect.add(new Option(name,name)));
 if(localNames.includes(selectedLocal))localSelect.value=selectedLocal;
 else if(localNames.length)localSelect.value=localNames[0];
 if(!localNames.length)localSelect.add(new Option('Chưa có bộ đề trên thiết bị',''));
 const serverSelect=document.getElementById('builderServerSubject');
 const selectedServer=serverSelect.value;
 serverSelect.replaceChildren();
 serverSubjects.forEach(subject=>serverSelect.add(new Option(subject.name,subject.file)));
 if(serverSubjects.some(subject=>subject.file===selectedServer))serverSelect.value=selectedServer;
 else if(serverSubjects.length)serverSelect.value=serverSubjects[0].file;
 if(target==='local'&&!localNames.length)
  setBuilderStatus('Chưa có bộ đề trên thiết bị. Chọn bộ đề máy chủ để sao chép hoặc tạo bộ đề mới.');
 else if(target==='server')
  setBuilderStatus('Bộ đề máy chủ sẽ được sao chép vào thiết bị khi bạn lưu. Câu hỏi gốc trên máy chủ không bị thay đổi.');
 else setBuilderStatus('');
}
function normalizeQuestionText(value){
 return value.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
}
function createQuestionId(existing){
 const numericIds=existing.map(question=>question.id).filter(id=>Number.isSafeInteger(id));
 if(numericIds.length===existing.length)return Math.max(0,...numericIds)+1;
 let id;
 do{id=`local_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;}
 while(existing.some(question=>question.id===id));
 return id;
}
async function saveBuilderQuestion(){
 try{
  const questionText=document.getElementById('builderQuestion').value.trim();
  const options=['A','B','C','D'].map((letter,index)=>document.getElementById(`builderOption${letter}`).value.trim());
  if(!questionText||options.some(option=>!option)){
   setBuilderStatus('Nhập câu hỏi và đủ bốn lựa chọn A, B, C, D trước khi lưu.','error');
   return;
  }
  const target=document.getElementById('builderTarget').value;
  const sets=getLocalSets();
  let subjectName,questionsToSave;
  if(target==='local'){
   subjectName=document.getElementById('builderLocalSubject').value;
   if(!subjectName||!Array.isArray(sets[subjectName]))
    throw new Error('Chọn một bộ đề đã lưu trên thiết bị hoặc tạo bộ đề mới.');
   questionsToSave=sets[subjectName];
  }else if(target==='new'){
   subjectName=document.getElementById('builderNewSubject').value.trim();
   if(!subjectName)throw new Error('Nhập tên cho bộ đề mới.');
   if(Array.isArray(sets[subjectName])){
    if(!confirm(`"${subjectName}" đã có trên thiết bị. Thêm câu hỏi vào bộ đề đó?`))return;
    questionsToSave=sets[subjectName];
   }else questionsToSave=[];
  }else{
   const filename=document.getElementById('builderServerSubject').value;
   const serverSubject=serverSubjects.find(subject=>subject.file===filename);
   if(!serverSubject)throw new Error('Chọn một bộ đề máy chủ hợp lệ.');
   subjectName=serverSubject.name;
   if(Array.isArray(sets[subjectName]))questionsToSave=sets[subjectName];
   else{
    const response=await fetch(encodeURIComponent(filename),{cache:'no-store'});
    if(!response.ok)throw new Error(`Không thể sao chép bộ đề máy chủ (${response.status}).`);
    const serverQuestions=await response.json();
    if(!Array.isArray(serverQuestions)||!serverQuestions.every(isQuestion))
     throw new Error('Bộ đề máy chủ không đúng định dạng.');
    questionsToSave=serverQuestions;
   }
  }
  const normalizedQuestion=normalizeQuestionText(questionText);
  const duplicate=questionsToSave.find(question=>
   normalizeQuestionText(question.question)===normalizedQuestion
  );
  if(duplicate&&!confirm(`Câu hỏi này có vẻ đã tồn tại trong "${subjectName}". Bạn vẫn muốn thêm một bản sao?`)){
   setBuilderStatus('Không thêm câu hỏi trùng lặp. Bạn có thể chỉnh sửa nội dung rồi thử lại.');
   return;
  }
  const question={
   id:createQuestionId(questionsToSave),
   question:questionText,
   options,
   answer:Number(document.querySelector('input[name=builderAnswer]:checked').value),
   explanation:document.getElementById('builderExplanation').value.trim()
  };
  const category=document.getElementById('builderCategory').value.trim();
  const topic=document.getElementById('builderTopic').value.trim();
  const difficulty=document.getElementById('builderDifficulty').value;
  if(category)question.category=category;
  if(topic)question.topic=topic;
  if(difficulty)question.difficulty=difficulty;
  questionsToSave.push(question);
  sets[subjectName]=questionsToSave;
  localStorage.setItem(localKey,JSON.stringify(sets));
  document.getElementById('source').value='local';
  await updateSubjects(subjectName);
  setBuilderStatus(`Đã lưu câu hỏi vào "${subjectName}" trên thiết bị. Tổng số: ${questionsToSave.length}.`,'success');
  document.getElementById('builderQuestion').value='';
  ['A','B','C','D'].forEach(letter=>document.getElementById(`builderOption${letter}`).value='');
  document.getElementById('builderExplanation').value='';
  document.querySelector('input[name=builderAnswer][value="0"]').checked=true;
 }catch(error){
  setBuilderStatus(error.message||'Không thể lưu câu hỏi.','error');
 }
}
function practiceWrongQuestions(){
 try{
  if(!getWrongQuestions().length){
   document.getElementById('sourceMessage').textContent='Chưa có câu trả lời sai để luyện tập.';
   updateWrongPracticeButton();
   return;
  }
  document.getElementById('source').value='local';
  updateSubjects(wrongQuestionsSubject);
 }catch(error){
  document.getElementById('sourceMessage').textContent=error.message||'Không thể tải câu trả lời sai.';
 }
}
function updateSubjects(selected){
 const source=document.getElementById('source').value;
 const subject=document.getElementById('subject');
 const entries=source==='server'
  ?serverSubjects.map(item=>({id:item.file,name:item.name}))
  :Object.keys(getLocalSets()).map(name=>({id:name,name}));
 if(source==='local'&&getWrongQuestions().length)
  entries.push({id:wrongQuestionsSubject,name:'Câu trả lời sai'});
 subject.replaceChildren();
 if(!entries.length){
  const option=document.createElement('option');
  option.value='';option.textContent=source==='local'?'Chưa có câu hỏi trên thiết bị':'Không tìm thấy tệp câu hỏi';
  subject.appendChild(option);
 }
 entries.forEach(item=>{
  const option=document.createElement('option');
  option.value=item.id; option.textContent=item.name; subject.appendChild(option);
 });
 if(selected&&entries.some(item=>item.id===selected)) subject.value=selected;
 return loadSubject();
}
async function loadSubject(){
 const source=document.getElementById('source').value;
 const id=document.getElementById('subject').value;
 const message=document.getElementById('sourceMessage');
 if(!id){allQuestions=[];message.textContent=source==='local'?'Chưa có bộ câu hỏi trên thiết bị. Hãy nhập tệp JSON.':serverDiscoveryError;updateCategories();updatePageTitle();return;}
 try{
  if(source==='server'){
   const response=await fetch(encodeURIComponent(id),{cache:'no-store'});
   if(!response.ok) throw new Error(`Không thể tải tệp câu hỏi (${response.status}).`);
   allQuestions=await response.json();
  }else allQuestions=id===wrongQuestionsSubject?getWrongQuestions():getLocalSets()[id]||[];
  if(!Array.isArray(allQuestions)||!allQuestions.every(isQuestion)){
   allQuestions=[];throw new Error('Tệp câu hỏi không đúng định dạng.');
  }
  message.textContent=`Đã tải ${allQuestions.length} câu hỏi.`;
  updateCategories();
  updatePageTitle();
 }catch(error){allQuestions=[];updateCategories();updatePageTitle();message.textContent=error.message||'Không thể tải câu hỏi.';}
}
function isQuestion(q){
 return q&&typeof q.question==='string'&&Array.isArray(q.options)&&
  q.options.every(o=>typeof o==='string')&&Number.isInteger(q.answer)&&
  q.answer>=0&&q.answer<q.options.length&&
  (q.explanation===undefined||typeof q.explanation==='string');
}
function escapeHtml(value){
 return String(value).split(/(<br\s*\/?>)/gi).map(part=>
  /^<br\s*\/?>$/i.test(part)
   ?'<br>'
   :part.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))
 ).join('');
}
function updateCategories(){
 const sel=document.getElementById('category');
 const selectedCategory=sel.value;
 sel.replaceChildren(new Option('Tất cả','ALL'));
 const categories=[...new Set(allQuestions.map(x=>x.category).filter(Boolean))];
 categories.forEach(category=>sel.add(new Option(category,category)));
 if(categories.includes(selectedCategory))sel.value=selectedCategory;
 const difficulty=document.getElementById('difficulty');
 const selectedDifficulty=difficulty.value;
 const difficulties=[...new Set(allQuestions.map(x=>x.difficulty).filter(Boolean))];
 const labels={easy:'Dễ',medium:'Trung bình',hard:'Khó'};
 difficulty.replaceChildren(new Option('Tất cả','ALL'));
 difficulties.forEach(value=>difficulty.add(new Option(labels[value]||value,value)));
 if(difficulties.includes(selectedDifficulty))difficulty.value=selectedDifficulty;
}
function updateModeSettings(){
 const isExam=document.querySelector('input[name=mode]:checked')?.value==='exam';
 document.getElementById('examTimerSetting').classList.toggle('hidden',!isExam);
}
function stopExamTimer(){
 if(examTimerInterval)clearInterval(examTimerInterval);
 examTimerInterval=null;
 examDeadline=0;
 const timer=document.getElementById('examTimer');
 timer.classList.add('hidden');
 timer.classList.remove('warning');
}
function startExamTimer(durationSeconds){
 const timer=document.getElementById('examTimer');
 examDeadline=Date.now()+durationSeconds*1000;
 timer.classList.remove('hidden');
 updateExamTimer();
 if(!examSubmitted)examTimerInterval=setInterval(updateExamTimer,1000);
}
function updateExamTimer(){
 const remaining=Math.max(0,Math.ceil((examDeadline-Date.now())/1000));
 const minutes=String(Math.floor(remaining/60)).padStart(2,'0');
 const seconds=String(remaining%60).padStart(2,'0');
 const timer=document.getElementById('examTimer');
 timer.classList.toggle('warning',remaining<=60);
 timer.textContent=remaining<=60
  ?`⚠️ Còn 1 phút hoặc ít hơn — ${minutes}:${seconds}`
  :`⏱️ Thời gian còn lại — ${minutes}:${seconds}`;
 if(remaining===0){
  if(examTimerInterval)clearInterval(examTimerInterval);
  examTimerInterval=null;
  submitQuiz(true);
 }
}
function updatePageTitle(){
 const translations={
  Bacteriology:'Vi khuẩn học',
  Chemistry:'Hóa học',
  Ethic:'Đạo đức',
  Ethics:'Đạo đức',
  Immunology:'Miễn dịch học',
  Mycology:'Nấm học',
  Parasitology:'Ký sinh trùng học',
  Probability:'Xác suất',
  Virology:'Virus học'
 };
 const icons={
  Bacteriology:'🦠',
  Chemistry:'🧪',
  Ethic:'⚖️',
  Ethics:'⚖️',
  Immunology:'🛡️',
  Mycology:'🍄',
  Parasitology:'🪱',
  Probability:'🎲',
  Virology:'🧬'
 };
 const categories=[...new Set(allQuestions.map(q=>q.category).filter(Boolean))];
 const selectedSubject=document.getElementById('subject').selectedOptions[0]?.textContent||'';
 const subjectNames={'XSTK':'Xác suất thống kê'};
 const title=categories.length
  ?categories.map(category=>translations[category]||category).join(', ')
  :subjectNames[selectedSubject]||selectedSubject;
 const localizedIcons={'Đạo đức':'⚖️','Xác suất':'🎲','Xác suất thống kê':'🎲'};
 const firstCategory=categories[0];
 const icon=firstCategory
  ?icons[firstCategory]||localizedIcons[firstCategory]||'📚'
  :selectedSubject==='XSTK'?'🎲':localizedIcons[title]||'🦠';
 document.getElementById('pageTitle').textContent=`${icon} Ôn tập${title?' '+title:''}`;
}
async function importQuestions(event){
 const file=event.target.files[0]; if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data)||!data.length||!data.every(isQuestion))
   throw new Error('JSON phải là danh sách câu hỏi có question, options và answer hợp lệ.');
  const name=file.name.replace(/\.json$/i,'').trim()||'Câu hỏi đã nhập';
  const sets=getLocalSets();sets[name]=data;
  localStorage.setItem(localKey,JSON.stringify(sets));
  document.getElementById('source').value='local';
  updateSubjects(name);
  document.getElementById('sourceMessage').textContent=`Đã nhập ${data.length} câu hỏi vào "${name}" trên thiết bị này.`;
 }catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể nhập tệp JSON.';}
 finally{event.target.value='';closeToolsMenu();}
}
function exportQuestions(){
 closeToolsMenu();
 if(!allQuestions.length){document.getElementById('sourceMessage').textContent='Không có câu hỏi để xuất.';return;}
 const blob=new Blob([JSON.stringify(allQuestions,null,2)],{type:'application/json'});
 const link=document.createElement('a');
 link.href=URL.createObjectURL(blob);
 link.download=(document.getElementById('subject').selectedOptions[0]?.textContent||'questions').replace(/[<>:"/\\|?*]/g,'_')+'.json';
 link.click();URL.revokeObjectURL(link.href);
}
updateWrongPracticeButton();
initializeSubjects();
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function startQuiz(){
 stopExamTimer();
 examSubmitted=false;
 const cat=document.getElementById('category').value;
 const difficulty=document.getElementById('difficulty').value;
 const count=parseInt(document.getElementById('count').value)||50;
 let pool=allQuestions.filter(x=>
  (cat==='ALL'||x.category===cat)&&
  (difficulty==='ALL'||x.difficulty===difficulty)
 );
 questions=shuffle(pool).slice(0,Math.min(count,pool.length));
 const mode=document.querySelector('input[name=mode]:checked').value;
 const root=document.getElementById('quiz');
 const result=document.getElementById('result');
 window.MathJax?.typesetClear?.([root,result]);
 root.innerHTML='';
 result.innerHTML='';
 if(!questions.length){
  document.body.classList.remove('exam-mode');
  document.getElementById('submitArea').classList.add('hidden');
  document.getElementById('sourceMessage').textContent='Không có câu hỏi phù hợp với bộ lọc đã chọn.';
  return;
 }
 isWrongQuestionsPractice=document.getElementById('source').value==='local'&&
  document.getElementById('subject').value===wrongQuestionsSubject;
 questions.forEach((q,i)=>{
 let html=`<div class='card' id='card${i}'><div class='progress'>Câu ${i+1}</div><p><b>${escapeHtml(q.question)}</b></p>`;
 q.options.forEach((o,idx)=>{
 html+=`<div class='answer-option'><label><input type='radio' name='q${i}' value='${idx}' onchange='answerQuestion(${i},${idx})'><span class='answer-content'>${escapeHtml(o)}</span></label></div>`;
 });
 html+=`<div id='feedback${i}'></div></div>`;
 root.innerHTML+=html;
 });
 renderMath(root);
 window.currentMode=mode;
 document.body.classList.toggle('exam-mode',mode==='exam');
 document.getElementById('submitArea').classList.toggle('hidden',mode!=='exam');
 if(mode==='exam'){
  const minutesInput=document.getElementById('minutesPerQuestion');
  const configuredMinutes=Number.parseInt(minutesInput.value,10);
  const minutes=Number.isFinite(configuredMinutes)?Math.max(1,Math.min(60,configuredMinutes)):2;
  minutesInput.value=String(minutes);
  startExamTimer(questions.length*minutes*60);
 }
 root.firstElementChild?.scrollIntoView({behavior:'smooth',block:'start'});
}
function answerQuestion(i,val){
 if(currentMode!=='study') return;
 const q=questions[i];
 const fb=document.getElementById('feedback'+i);
 const card=document.getElementById('card'+i);
 window.MathJax?.typesetClear?.([fb]);
 if(val===q.answer){
 card.classList.add('correct');
 fb.innerHTML=`✅ Đúng<br><small>${escapeHtml(q.explanation||'')}</small>`;
 renderMath(fb);
 if(isWrongQuestionsPractice){
  try{removeWrongQuestions([q]);}
  catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể cập nhật danh sách câu sai.';}
 }
 }else{
 card.classList.add('wrong');
 fb.innerHTML=`❌ Sai<br>Đáp án đúng: <b>${escapeHtml(q.options[q.answer])}</b><br><small>${escapeHtml(q.explanation||'')}</small>`;
 renderMath(fb);
 try{saveWrongQuestions([q]);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể lưu câu trả lời sai.';}
 }
 }
function submitQuiz(timeExpired=false){
 if(window.currentMode!=='exam'||examSubmitted)return;
 examSubmitted=true;
 if(examTimerInterval)clearInterval(examTimerInterval);
 examTimerInterval=null;
 const timer=document.getElementById('examTimer');
 timer.classList.remove('hidden');
 timer.classList.toggle('warning',timeExpired);
 timer.textContent=timeExpired?'⏰ Hết giờ — bài thi đã được nộp tự động.':'✅ Bài thi đã được nộp.';
 document.getElementById('submitArea').classList.add('hidden');
 document.body.classList.remove('exam-mode');
 let score=0,review='',wrongQuestions=[],correctWrongQuestions=[];
 questions.forEach((q,i)=>{
 const checked=document.querySelector(`input[name=q${i}]:checked`);
 const user=checked?Number(checked.value):-1;
 const correct=user===q.answer;
 if(correct){
  score++;
  if(isWrongQuestionsPractice)correctWrongQuestions.push(q);
 }else wrongQuestions.push(q);
 review+=`<div class='card ${correct?'correct':'wrong'}'>Câu ${i+1}: ${correct?'✅':'❌'}<br>Đáp án đúng: <b>${escapeHtml(q.options[q.answer])}</b><br>${escapeHtml(q.explanation||'')}</div>`;
 });
 try{saveWrongQuestions(wrongQuestions);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể lưu câu trả lời sai.';}
 try{removeWrongQuestions(correctWrongQuestions);}
 catch(error){document.getElementById('sourceMessage').textContent=error.message||'Không thể cập nhật danh sách câu sai.';}
 const result=document.getElementById('result');
 window.MathJax?.typesetClear?.([result]);
 result.innerHTML=`<div class='card'><h2>Điểm: ${score}/${questions.length}</h2><p>${Math.round(score*100/questions.length)}%</p></div>`+review;
 renderMath(result);
 window.scrollTo(0,document.body.scrollHeight);
}
</script>
